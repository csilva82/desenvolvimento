<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Editor de Nós – Arduino / ESP32</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px system-ui,sans-serif;background:#12151c;color:#e5e7eb;height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:6px;align-items:center;padding:8px;background:#1b1f2a;border-bottom:1px solid #2b3040;flex-wrap:wrap}
  header b{margin-right:8px}
  button,select,input{font:inherit}
  button{background:#2b3347;color:#e5e7eb;border:1px solid #3b4460;border-radius:6px;padding:5px 10px;cursor:pointer}
  button:hover{background:#38425e}
  button.pri{background:#2563eb;border-color:#2563eb}
  button.ok{background:#16a34a;border-color:#16a34a}
  button.bad{background:#b91c1c;border-color:#b91c1c}
  select,input[type=text],input[type=number]{background:#0f1218;color:#e5e7eb;border:1px solid #3b4460;border-radius:5px;padding:3px 5px}
  main{flex:1;display:flex;min-height:0}
  #palette{width:150px;padding:8px;background:#161a23;border-right:1px solid #2b3040;overflow:auto;display:flex;flex-direction:column;gap:5px}
  #palette h4{margin:6px 0 2px;color:#9aa3b8;font-weight:600}
  #palette button{text-align:left;border-left:4px solid var(--c)}
  #scroll{flex:1;overflow:auto;position:relative;background:#0f1218}
  #canvas{position:relative;width:3000px;height:2000px;
    background-image:radial-gradient(#252b3a 1px,transparent 1px);background-size:20px 20px}
  #wires{position:absolute;inset:0;width:3000px;height:2000px;pointer-events:none}
  #wires path{fill:none;stroke:#60a5fa;stroke-width:3;pointer-events:stroke;cursor:pointer}
  #wires path:hover{stroke:#f87171}
  #wires path.tmp{stroke:#fbbf24;stroke-dasharray:5 4;pointer-events:none}
  .node{position:absolute;width:190px;background:#1e2433;border:1px solid #3b4460;border-radius:8px;box-shadow:0 4px 10px #0006;user-select:none}
  .node .hd{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 18px;background:var(--c);border-radius:7px 7px 0 0;cursor:move;position:relative}
  .node .hd b{flex:1;font-size:12px}
  .node .hd .x{cursor:pointer;opacity:.8;padding:0 3px}
  .node .hd .x:hover{opacity:1}
  .node .bd{padding:6px 8px;display:flex;flex-direction:column;gap:5px}
  .node label{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .node label input,.node label select{width:95px}
  .node .out{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:3px 0;color:#9aa3b8}
  .port{width:14px;height:14px;border-radius:50%;background:#e5e7eb;border:2px solid #12151c;cursor:crosshair;display:inline-block}
  .port:hover{background:#fbbf24}
  .port.in{position:absolute;left:-8px;top:50%;margin-top:-7px}
  .port.out{margin-right:-15px}
  #right{width:430px;display:flex;flex-direction:column;border-left:1px solid #2b3040;background:#161a23}
  #tabs{display:flex}
  #tabs button{flex:1;border-radius:0;border:0;border-bottom:2px solid transparent;background:transparent}
  #tabs button.on{border-color:#2563eb;background:#1b1f2a}
  .panel{display:none;flex:1;overflow:auto;padding:8px;min-height:0}
  .panel.on{display:block}
  pre{margin:0;white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace}
  #pins{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
  .pin{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#9aa3b8}
  .led{width:22px;height:22px;border-radius:50%;background:#3a2020;border:2px solid #555}
  .led.on{background:#ef4444;box-shadow:0 0 12px #ef4444;border-color:#fca5a5}
  .pin button{padding:1px 6px;font-size:11px}
  #serial{background:#0b0d12;border:1px solid #2b3040;border-radius:6px;padding:6px;height:200px;overflow:auto}
  a.dl{display:block;margin:4px 0;color:#60a5fa}
  small{color:#9aa3b8}
</style>
</head>
<body>
<header>
  <b>⚙ Editor de Nós</b>
  <select id="board">
    <option value="arduino:avr:uno" data-sim="1">Arduino Uno</option>
    <option value="arduino:avr:nano:cpu=atmega328" data-sim="1">Arduino Nano</option>
    <option value="arduino:avr:mega">Arduino Mega</option>
    <option value="esp32:esp32:esp32">ESP32</option>
  </select>
  <button class="pri" id="bCompile">Compilar</button>
  <button class="ok" id="bSim">▶ Simular</button>
  <button class="bad" id="bStop">■ Parar</button>
  <span style="flex:1"></span>
  <select id="port"><option value="">(porta)</option></select>
  <button id="bPorts" title="Atualizar portas">↻</button>
  <button id="bFlash">Gravar na placa</button>
  <span style="flex:1"></span>
  <button id="bSave">Salvar projeto</button>
  <button id="bOpen">Abrir projeto</button>
  <input type="file" id="file" accept=".json" hidden>
</header>

<main>
  <div id="palette"></div>
  <div id="scroll">
    <div id="canvas"><svg id="wires"></svg></div>
  </div>
  <div id="right">
    <div id="tabs">
      <button data-t="pCode" class="on">Código</button>
      <button data-t="pSim">Simulação</button>
      <button data-t="pLog">Log / Downloads</button>
    </div>
    <div id="pCode" class="panel on"><pre id="code"></pre></div>
    <div id="pSim" class="panel">
      <small>Clique e segure os botões para simular um botão ligado ao pino (pressionado = LOW, solto = HIGH). Só AVR (Uno/Nano).</small>
      <div id="pins" style="margin-top:8px"></div>
      <b>Serial</b>
      <div id="serial"><pre id="serialOut"></pre></div>
      <small id="simInfo"></small>
    </div>
    <div id="pLog" class="panel"><div id="downloads"></div><pre id="log"></pre></div>
  </div>
</main>

<script>
/* ============ utilitários ============ */
const $ = s => document.querySelector(s);
const canvas = $('#canvas'), wires = $('#wires');
const F = {
  pin:  {k:'pin', t:'num', label:'Pino', def:13},
};
const SVGNS = 'http://www.w3.org/2000/svg';
// URL do backend: ?api=https://meu-servidor.onrender.com (fica salva no navegador). Vazio = mesmo servidor.
const _q = new URLSearchParams(location.search).get('api');
if (_q !== null) localStorage.setItem('api', _q.replace(/\/$/, ''));
const API = localStorage.getItem('api') || '';
async function apiJson(rota, opts) {
  let resp;
  try { resp = await fetch(API + rota, opts); }
  catch (e) { throw new Error('Não consegui conectar ao backend (' + (API || location.origin) + ').\n' +
    'Verifique se o server.py está rodando e, no GitHub Pages, se a URL do backend foi informada com ?api=...'); }
  const txt = await resp.text();
  try { return JSON.parse(txt); }
  catch (e) { throw new Error('O endereço ' + (API || location.origin) + rota + ' não respondeu como o servidor de compilação (HTTP ' + resp.status + ').\n' +
    'Este site precisa do backend (server.py). Abra http://localhost:5000, use o Codespaces, ou informe o backend com ?api=https://seu-backend na URL.'); }
}

/* ============ definição dos nós ============ */
const DEFS = {
  setup:   {title:'Setup (início)', color:'#7c3aed', ins:0, outs:['▶'], fields:[], gen:()=>''},
  loop:    {title:'Loop (repete)',  color:'#7c3aed', ins:0, outs:['▶'], fields:[], gen:()=>''},
  pinMode: {title:'Modo do pino', color:'#0284c7', ins:1, outs:['▶'],
            fields:[F.pin,{k:'mode',t:'sel',label:'Modo',opts:['OUTPUT','INPUT','INPUT_PULLUP'],def:'OUTPUT'}],
            gen:(d,I)=>`${I}pinMode(${d.pin}, ${d.mode});\n`},
  dwrite:  {title:'Escrever digital', color:'#16a34a', ins:1, outs:['▶'],
            fields:[F.pin,{k:'val',t:'sel',label:'Valor',opts:['HIGH','LOW','INVERTER'],def:'HIGH'}],
            gen:(d,I)=> d.val==='INVERTER'
              ? `${I}digitalWrite(${d.pin}, !digitalRead(${d.pin}));\n`
              : `${I}digitalWrite(${d.pin}, ${d.val});\n`},
  awrite:  {title:'Escrever PWM', color:'#16a34a', ins:1, outs:['▶'],
            fields:[F.pin,{k:'val',t:'num',label:'Valor 0-255',def:128}],
            gen:(d,I)=>`${I}analogWrite(${d.pin}, ${d.val});\n`},
  delay:   {title:'Esperar (ms)', color:'#ca8a04', ins:1, outs:['▶'],
            fields:[{k:'ms',t:'num',label:'ms',def:500}],
            gen:(d,I)=>`${I}delay(${d.ms});\n`},
  sbegin:  {title:'Serial.begin', color:'#db2777', ins:1, outs:['▶'],
            fields:[{k:'baud',t:'sel',label:'Baud',opts:['9600','19200','57600','115200'],def:'9600'}],
            gen:(d,I)=>`${I}Serial.begin(${d.baud});\n`},
  sprint:  {title:'Serial imprimir', color:'#db2777', ins:1, outs:['▶'],
            fields:[{k:'txt',t:'txt',label:'Texto',def:'Olá'},
                    {k:'nl',t:'sel',label:'Tipo',opts:['println','print'],def:'println'}],
            gen:(d,I)=>`${I}Serial.${d.nl}(${JSON.stringify(d.txt)});\n`},
  aread:   {title:'Ler analógico → Serial', color:'#db2777', ins:1, outs:['▶'],
            fields:[{k:'pin',t:'txt',label:'Pino',def:'A0'}],
            gen:(d,I)=>`${I}Serial.println(analogRead(${d.pin}));\n`},
  ifpin:   {title:'Se pino digital', color:'#ea580c', ins:1, outs:['então','senão','▶ depois'],
            fields:[F.pin,{k:'lvl',t:'sel',label:'for',opts:['LOW','HIGH'],def:'LOW'}],
            gen:(d,I,b)=>`${I}if (digitalRead(${d.pin}) == ${d.lvl}) {\n${b[0]}${I}} else {\n${b[1]}${I}}\n`},
  repeat:  {title:'Repetir N vezes', color:'#ea580c', ins:1, outs:['corpo','▶ depois'],
            fields:[{k:'n',t:'num',label:'N',def:3}],
            gen:(d,I,b)=>`${I}for (int _i = 0; _i < ${d.n}; _i++) {\n${b[0]}${I}}\n`},
};
const GROUPS = {'Estrutura':['setup','loop'],'Pinos':['pinMode','dwrite','awrite','aread'],
                'Tempo':['delay'],'Serial':['sbegin','sprint'],'Controle':['ifpin','repeat']};

/* ============ estado ============ */
let nodes = {}, links = [], nid = 1;

/* ============ paleta ============ */
const pal = $('#palette');
for (const [g, list] of Object.entries(GROUPS)) {
  const h = document.createElement('h4'); h.textContent = g; pal.appendChild(h);
  list.forEach(t => {
    const b = document.createElement('button');
    b.textContent = DEFS[t].title; b.style.setProperty('--c', DEFS[t].color);
    b.onclick = () => { const sc = $('#scroll');
      addNode(t, sc.scrollLeft + 40 + Math.random()*60, sc.scrollTop + 40 + Math.random()*60); genCode(); };
    pal.appendChild(b);
  });
}

/* ============ nós ============ */
function addNode(type, x, y, data, forceId) {
  const id = forceId || nid++;
  if (forceId && forceId >= nid) nid = forceId + 1;
  const d = {}; DEFS[type].fields.forEach(f => d[f.k] = f.def);
  nodes[id] = {id, type, x, y, data: Object.assign(d, data || {})};
  mountNode(nodes[id]); drawLinks(); return id;
}

function mountNode(n) {
  const def = DEFS[n.type];
  const el = document.createElement('div');
  el.className = 'node'; el.id = 'n' + n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  el.style.setProperty('--c', def.color);

  const hd = document.createElement('div'); hd.className = 'hd';
  if (def.ins) { const p = document.createElement('i'); p.className = 'port in'; p.dataset.id = n.id; hd.appendChild(p); }
  hd.innerHTML += `<b>${def.title}</b><span class="x">×</span>`;
  el.appendChild(hd);

  const bd = document.createElement('div'); bd.className = 'bd';
  def.fields.forEach(f => {
    const row = document.createElement('label'); row.append(f.label);
    let inp;
    if (f.t === 'sel') {
      inp = document.createElement('select');
      f.opts.forEach(o => { const op = document.createElement('option'); op.textContent = o; inp.appendChild(op); });
    } else { inp = document.createElement('input'); inp.type = f.t === 'num' ? 'number' : 'text'; }
    inp.value = n.data[f.k];
    inp.oninput = () => { n.data[f.k] = inp.value; genCode(); };
    inp.onmousedown = e => e.stopPropagation();
    row.appendChild(inp); bd.appendChild(row);
  });
  def.outs.forEach((lab, i) => {
    const r = document.createElement('div'); r.className = 'out';
    r.innerHTML = `<span>${lab}</span><i class="port out" data-id="${n.id}" data-p="${i}"></i>`;
    bd.appendChild(r);
  });
  el.appendChild(bd);
  canvas.appendChild(el);

  // excluir
  hd.querySelector('.x').onclick = () => {
    el.remove(); delete nodes[n.id];
    links = links.filter(l => l.from !== n.id && l.to !== n.id);
    drawLinks(); genCode();
  };
  // arrastar
  hd.onmousedown = e => {
    if (e.target.closest('.port') || e.target.closest('.x')) return;
    const ox = e.clientX - n.x, oy = e.clientY - n.y;
    const mv = ev => { n.x = Math.max(0, ev.clientX - ox); n.y = Math.max(0, ev.clientY - oy);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; drawLinks(); };
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  };
  // ligar fios a partir das portas de saída
  bd.querySelectorAll('.port.out').forEach(p => p.onmousedown = e => startWire(e, n.id, +p.dataset.p));
}

/* ============ fios ============ */
function center(el) {
  const r = el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return {x: r.left - c.left + r.width/2, y: r.top - c.top + r.height/2};
}
function bez(a, b) {
  const dx = Math.max(50, Math.abs(b.x - a.x) / 2);
  return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;
}
function drawLinks() {
  wires.innerHTML = '';
  links.forEach((l, i) => {
    const a = document.querySelector(`#n${l.from} .port.out[data-p="${l.port}"]`);
    const b = document.querySelector(`#n${l.to} .port.in`);
    if (!a || !b) return;
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', bez(center(a), center(b)));
    p.onclick = () => { if (confirm('Remover esta ligação?')) { links.splice(i, 1); drawLinks(); genCode(); } };
    wires.appendChild(p);
  });
}
function startWire(e, from, port) {
  e.preventDefault(); e.stopPropagation();
  const a = center(e.target);
  const tmp = document.createElementNS(SVGNS, 'path'); tmp.setAttribute('class', 'tmp'); wires.appendChild(tmp);
  const mv = ev => { const c = canvas.getBoundingClientRect();
    tmp.setAttribute('d', bez(a, {x: ev.clientX - c.left, y: ev.clientY - c.top})); };
  const up = ev => {
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
    tmp.remove();
    const t = document.elementFromPoint(ev.clientX, ev.clientY);
    const inp = t && t.closest('.port.in');
    if (inp && +inp.dataset.id !== from) {
      links = links.filter(l => !(l.from === from && l.port === port));   // 1 fio por saída
      links.push({from, port, to: +inp.dataset.id});
      genCode();
    }
    drawLinks();
  };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
}

/* ============ gerador de código ============ */
function nextOf(id, p) { const l = links.find(l => l.from === id && l.port === p); return l ? l.to : null; }
function genChain(id, ind, seen) {
  let out = '';
  while (id != null && !seen.has(id)) {
    seen.add(id);
    const n = nodes[id], def = DEFS[n.type], last = def.outs.length - 1;
    const body = def.outs.slice(0, last).map((_, p) => genChain(nextOf(id, p), ind + '  ', new Set(seen)));
    out += def.gen(n.data, ind, body);
    id = nextOf(id, last);
  }
  return out;
}
function genCode() {
  let s = '', l = '';
  Object.values(nodes).sort((a, b) => a.y - b.y).forEach(n => {
    if (n.type === 'setup') s += genChain(nextOf(n.id, 0), '  ', new Set());
    if (n.type === 'loop')  l += genChain(nextOf(n.id, 0), '  ', new Set());
  });
  const code = `void setup() {\n${s}}\n\nvoid loop() {\n${l}}\n`;
  $('#code').textContent = code;
  return code;
}

/* ============ projeto padrão (Blink) ============ */
function demo() {
  const s = addNode('setup', 40, 40), pm = addNode('pinMode', 40, 130);
  const lp = addNode('loop', 300, 40), w1 = addNode('dwrite', 300, 130, {val:'HIGH'});
  const d1 = addNode('delay', 300, 250), w2 = addNode('dwrite', 300, 340, {val:'LOW'});
  const d2 = addNode('delay', 300, 460);
  links = [{from:s,port:0,to:pm},{from:lp,port:0,to:w1},{from:w1,port:0,to:d1},
           {from:d1,port:0,to:w2},{from:w2,port:0,to:d2}];
  drawLinks(); genCode();
}

/* ============ compilar / baixar ============ */
let lastFiles = {};
const log = t => { $('#log').textContent = t; };
function showTab(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === id));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.t));

async function compilar() {
  const code = genCode();
  showTab('pLog'); log('Compilando… (a 1ª vez pode demorar)'); $('#downloads').innerHTML = '';
  let r;
  try {
    r = await apiJson('/compile', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sketch: code, fqbn: $('#board').value})});
  } catch (e) { log(e.message); return null; }
  log(r.log || '');
  if (!r.ok) return null;
  lastFiles = r.files;
  const box = $('#downloads');
  Object.entries(r.files).forEach(([nome, b64]) => {
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const a = document.createElement('a'); a.className = 'dl'; a.textContent = '⬇ ' + nome + ` (${bin.length} bytes)`;
    a.href = URL.createObjectURL(new Blob([bin])); a.download = nome; box.appendChild(a);
  });
  return r.files;
}

/* ============ simulador (avr8js) ============ */
let sim = null;
function hexToBytes(hex) {
  const bytes = new Uint8Array(0x8000);
  hex.split(/\r?\n/).forEach(line => {
    if (line[0] !== ':') return;
    const len = parseInt(line.substr(1,2),16), addr = parseInt(line.substr(3,4),16), type = parseInt(line.substr(7,2),16);
    if (type === 0) for (let i = 0; i < len; i++) bytes[addr + i] = parseInt(line.substr(9 + i*2, 2), 16);
  });
  return bytes;
}
function buildPins() {
  const box = $('#pins'); box.innerHTML = '';
  for (let p = 0; p <= 13; p++) {
    const d = document.createElement('div'); d.className = 'pin';
    d.innerHTML = `<div class="led" id="led${p}"></div><span>D${p}</span>` +
      (p >= 2 ? `<button data-p="${p}">btn</button>` : '');
    box.appendChild(d);
  }
}
function pinMap(ports, p) {            // pino Arduino → {porta, bit}
  if (p <= 7) return {port: ports.D, bit: p};
  return {port: ports.B, bit: p - 8};
}
async function simular() {
  stopSim();
  const opt = $('#board').selectedOptions[0];
  if (!opt.dataset.sim) { alert('A simulação só funciona para Uno/Nano (AVR).'); return; }
  const files = await compilar();
  if (!files) return;
  const nome = Object.keys(files).find(n => n.endsWith('.hex') && !n.includes('with_bootloader'));
  if (!nome) { alert('.hex não encontrado'); return; }
  showTab('pSim'); $('#serialOut').textContent = '';
  let A;
  try { A = await import('https://cdn.jsdelivr.net/npm/avr8js@0.20.0/dist/esm/index.js'); }
  catch (e) { alert('Não foi possível carregar o avr8js (precisa de internet).'); return; }

  const hex = atob(files[nome]);
  const cpu = new A.CPU(new Uint16Array(hexToBytes(hex).buffer));
  new A.AVRTimer(cpu, A.timer0Config); new A.AVRTimer(cpu, A.timer1Config); new A.AVRTimer(cpu, A.timer2Config);
  const ports = {B: new A.AVRIOPort(cpu, A.portBConfig), D: new A.AVRIOPort(cpu, A.portDConfig)};
  const usart = new A.AVRUSART(cpu, A.usart0Config, 16e6);
  usart.onByteTransmit = b => { const o = $('#serialOut'); o.textContent += String.fromCharCode(b);
    if (o.textContent.length > 5000) o.textContent = o.textContent.slice(-4000);
    $('#serial').scrollTop = 1e9; };

  const refresh = () => {
    for (let p = 0; p <= 13; p++) { const m = pinMap(ports, p);
      $('#led' + p).classList.toggle('on', m.port.pinState(m.bit) === A.PinState.High); }
  };
  ports.B.addListener(refresh); ports.D.addListener(refresh);
  for (let p = 2; p <= 13; p++) { const m = pinMap(ports, p); m.port.setPin(m.bit, true); }   // botões soltos = HIGH

  document.querySelectorAll('#pins button').forEach(b => {
    const m = pinMap(ports, +b.dataset.p);
    const down = () => m.port.setPin(m.bit, false), up = () => m.port.setPin(m.bit, true);
    b.onmousedown = down; b.onmouseup = up; b.onmouseleave = up;
  });

  sim = {raf: 0};
  const t0 = performance.now();
  const frame = () => {
    if (!sim) return;
    const alvo = cpu.cycles + 266666;           // 16 MHz / 60 fps
    while (cpu.cycles < alvo) { A.avrInstruction(cpu); cpu.tick(); }
    $('#simInfo').textContent = `Tempo simulado: ${(cpu.cycles / 16000).toFixed(0)} ms`;
    sim.raf = requestAnimationFrame(frame);
  };
  frame();
}
function stopSim() { if (sim) { cancelAnimationFrame(sim.raf); sim = null; } }

/* ============ gravar via arduino-cli (servidor local) ============ */
async function atualizarPortas() {
  const r = await apiJson('/ports');
  const s = $('#port'); s.innerHTML = '';
  (r.ports || []).forEach(p => { const o = document.createElement('option'); o.textContent = p; s.appendChild(o); });
  if (!s.children.length) s.innerHTML = '<option value="">(nenhuma porta)</option>';
}
async function gravar() {
  const port = $('#port').value;
  if (!port) { alert('Selecione uma porta (↻ para atualizar).'); return; }
  showTab('pLog'); log('Compilando e gravando em ' + port + '…');
  let r;
  try {
    r = await apiJson('/upload', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sketch: genCode(), fqbn: $('#board').value, port})});
  } catch (e) { log(e.message); return; }
  log((r.ok ? '✔ Gravado com sucesso\n\n' : '✘ Falhou\n\n') + (r.log || ''));
}

/* ============ salvar / abrir ============ */
function salvar() {
  const blob = new Blob([JSON.stringify({nodes, links, nid, fqbn: $('#board').value}, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'projeto-nos.json'; a.click();
}
function abrir(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const d = JSON.parse(rd.result);
    document.querySelectorAll('.node').forEach(n => n.remove());
    nodes = {}; links = d.links || []; nid = d.nid || 1;
    if (d.fqbn) $('#board').value = d.fqbn;
    Object.values(d.nodes).forEach(n => addNode(n.type, n.x, n.y, n.data, n.id));
    drawLinks(); genCode();
  };
  rd.readAsText(file);
}

/* ============ eventos ============ */
$('#bCompile').onclick = compilar;
$('#bSim').onclick = simular;
$('#bStop').onclick = stopSim;
$('#bFlash').onclick = gravar;
$('#bPorts').onclick = atualizarPortas;
$('#bSave').onclick = salvar;
$('#bOpen').onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && abrir(e.target.files[0]);
$('#scroll').addEventListener('scroll', drawLinks);

buildPins(); demo(); atualizarPortas().catch(() => {});
</script>
